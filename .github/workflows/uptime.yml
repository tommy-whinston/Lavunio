name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API health
        id: health
        shell: bash
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 https://api.lavunio.pro/v1/health || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          body=$(head -c 500 /tmp/health.json 2>/dev/null || true)
          echo "body=$body" >> "$GITHUB_OUTPUT"
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          if [ "$code" != "200" ]; then
            exit 1
          fi

      - name: Report incident or recovery
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_CODE: ${{ steps.health.outputs.code }}
          HEALTH_BODY: ${{ steps.health.outputs.body }}
        with:
          script: |
            const ok = process.env.HEALTH_CODE === '200';
            const label = 'incident';
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 10
            });

            if (!ok) {
              if (issues.data.length === 0) {
                await github.rest.issues.create({
                  owner,
                  repo,
                  title: 'API Lavunio недоступен',
                  labels: [label],
                  body: [
                    'Проверка `https://api.lavunio.pro/v1/health` не прошла.',
                    '',
                    `Код ответа: \`${process.env.HEALTH_CODE || 'нет ответа'}\``,
                    '',
                    '```',
                    (process.env.HEALTH_BODY || '').slice(0, 4000),
                    '```',
                    '',
                    `Время: ${new Date().toISOString()}`
                  ].join('\n')
                });
              }
              return;
            }

            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `API снова доступен (${new Date().toISOString()}). Закрываю инцидент.`
              });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }
