<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>Lavunio</title>
  <script>
    // Тема до отрисовки: та же, что выбрал пользователь в лаунчере.
    (function () {
      var theme = 'dark';
      try {
        theme = localStorage.getItem('lavunio.theme') || 'dark';
        if (theme === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
      } catch (_) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="styles/base/variables.css">
  <link rel="stylesheet" href="tray.css">
</head>
<body>
  <div class="tray-panel" role="menu" aria-label="Lavunio">
    <button class="tray-item" type="button" role="menuitem" data-action="show" data-key="show">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2.5 3h11a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Zm-1 2.5h13" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Открыть Lavunio</span>
    </button>
    <button class="tray-item" type="button" role="menuitem" data-action="hide" data-key="hide">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2.5 10.5h11M2.5 13h11M3 6.5h10l-1.6-3.4a1 1 0 0 0-.9-.6H5.5a1 1 0 0 0-.9.6L3 6.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Скрыть в трей</span>
    </button>
    <button class="tray-item" type="button" role="menuitem" data-action="updates" data-key="updates">
      <svg class="ic" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.5M13 2.8v2.7h-2.7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Проверить обновления</span>
    </button>
    <button class="tray-item" type="button" role="menuitem" data-action="folder" data-key="folder">
      <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5A1.5 1.5 0 0 1 3.5 3h3l1.5 2h4.5A1.5 1.5 0 0 1 14 6.5v5A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5v-7Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span>Открыть папку игры</span>
    </button>
    <div class="tray-sep" role="separator"></div>
    <button class="tray-item danger" type="button" role="menuitem" data-action="quit" data-key="quit">
      <svg class="ic" viewBox="0 0 16 16"><path d="M8 2v5M5.2 3.6a5 5 0 1 0 5.6 0" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      <span>Выйти</span>
    </button>
  </div>
  <script src="tray.js"></script>
</body>
</html>
