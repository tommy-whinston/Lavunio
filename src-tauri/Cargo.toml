[package]
name = "lavunio"
version = "0.8.0"
description = "Lavunio - Minecraft mode store with Ely.by accounts"
authors = ["TM"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2"
base64 = "0.22"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "rustls"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
rfd = "0.17"
open = "5"
dirs = "6"
sysinfo = "0.39"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
mc-launcher-core = "0.1.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = true
